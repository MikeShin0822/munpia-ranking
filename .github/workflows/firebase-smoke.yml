name: Firebase Analytics smoke check

on:
  push:
    branches: [main]
    paths:
      - firebase-analytics.js
      - live-data.js
      - .github/workflows/firebase-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect Munpia rankings with diagnostics when requested
        if: contains(github.event.head_commit.message, '[munpia-collect]')
        shell: bash
        run: |
          set +e
          rm -rf raw
          mkdir -p raw
          : > raw/status.log
          ua='Mozilla/5.0 (compatible; MunpiaTitleArchive/1.2; +https://github.com/MikeShin0822/munpia-ranking)'

          fetch_one() {
            name="$1"
            url="$2"
            out="raw/$name"
            code=$(curl -L -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 45 -A "$ua" -H 'accept-language: ko-KR,ko;q=0.9' "$url")
            curl_code=$?
            size=0
            if [ -f "$out" ]; then size=$(wc -c < "$out"); fi
            printf '%s http=%s curl=%s bytes=%s\n' "$name" "${code:-none}" "$curl_code" "$size" >> raw/status.log
          }

          for section in today plsa.eachtoday prefer plsa.bestseller; do
            safe=${section//./_}
            for page in 1 2 3; do
              url="https://mm.munpia.com/?ajx=1&menu=best&action=list&section=${section}&keyword=&page=${page}"
              fetch_one "${safe}-${page}.json" "$url" &
            done
          done
          fetch_one "exclusive.html" 'https://www.munpia.com/best/plsa.exclusive-eachtoday' &
          wait
          sort -o raw/status.log raw/status.log
          cat raw/status.log

          python scripts/build_snapshot_from_raw.py > /tmp/build.log 2>&1
          build_code=$?
          cat /tmp/build.log
          report_code=99
          if [ "$build_code" -eq 0 ]; then
            node scripts/report.mjs > /tmp/report.log 2>&1
            report_code=$?
            cat /tmp/report.log
          else
            : > /tmp/report.log
          fi

          python - "$build_code" "$report_code" <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = {
              'checkedAt': dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
              'endpointStatus': Path('raw/status.log').read_text(encoding='utf-8', errors='replace').splitlines(),
              'buildExitCode': int(sys.argv[1]),
              'reportExitCode': int(sys.argv[2]),
              'buildLog': Path('/tmp/build.log').read_text(encoding='utf-8', errors='replace')[-8000:],
              'reportLog': Path('/tmp/report.log').read_text(encoding='utf-8', errors='replace')[-8000:],
          }
          Path('data/munpia-fetch-diagnostic.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json data/latest-report.json data/munpia-fetch-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "data: collect daily Munpia rankings"
            git push origin HEAD:main
          fi
          exit 0

      - name: Verify deployed resources
        shell: bash
        run: |
          set -euo pipefail
          base="https://mikeshin0822.github.io/munpia-ranking"
          curl --fail --location --silent --show-error "$base/firebase-analytics.js?v=${GITHUB_SHA}" -o /tmp/firebase-analytics.js
          grep -q "site_loaded" /tmp/firebase-analytics.js
          grep -q "page_view" /tmp/firebase-analytics.js
          curl --fail --location --silent --show-error "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js" -o /dev/null
          curl --fail --location --silent --show-error "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js" -o /dev/null

      - name: Verify browser sends Analytics request
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.54.2
          cat > firebase-smoke.mjs <<'EOF'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const page = await browser.newPage();
          const analyticsRequests = [];
          const consoleMessages = [];

          page.on('request', request => {
            const url = request.url();
            if (url.includes('/g/collect') || url.includes('google-analytics.com')) {
              analyticsRequests.push(url);
            }
          });
          page.on('console', message => consoleMessages.push(`${message.type()}: ${message.text()}`));
          page.on('pageerror', error => consoleMessages.push(`pageerror: ${error.message}`));

          await page.goto('https://mikeshin0822.github.io/munpia-ranking/?firebase_debug=1', {
            waitUntil: 'networkidle',
            timeout: 60000
          });
          await page.waitForTimeout(8000);

          const diagnostics = await page.evaluate(() => ({
            status: document.documentElement.dataset.firebaseAnalytics || null,
            runtime: window.munpiaAnalyticsStatus || null,
            source: window.munpiaAnalytics?.source || null,
            dataLayerEvents: Array.isArray(window.dataLayer)
              ? window.dataLayer.filter(item => item?.[0] === 'event').map(item => item?.[1])
              : []
          }));

          console.log(JSON.stringify({ diagnostics, analyticsRequests, consoleMessages }, null, 2));

          if (!diagnostics.status || diagnostics.status === 'blocked') {
            throw new Error(`Analytics did not initialize: ${JSON.stringify(diagnostics)}`);
          }
          if (!analyticsRequests.length) {
            throw new Error('No Google Analytics collection request was observed.');
          }

          await browser.close();
          EOF
          node firebase-smoke.mjs
