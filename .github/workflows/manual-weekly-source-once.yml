name: Build one weekly Munpia pattern baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-weekly-source-once.txt'

permissions:
  contents: write

concurrency:
  group: munpia-weekly-source-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate quantitative baseline
        run: python scripts/build_weekly_patterns.py --start 2026-08-24 --end 2026-08-30
      - name: Validate baseline
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/weekly-patterns/2026-08-24_2026-08-30.json').read_text(encoding='utf-8'))
          assert report['startDate'] == '2026-08-24'
          assert report['endDate'] == '2026-08-30'
          assert report['dataQuality']['complete'] is True
          assert 8 <= len(report['patterns']) <= 10
          print('baseline validation passed')
          PY
      - name: Commit baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns
          git commit -m 'chore: generate 2026-08-24 weekly pattern baseline'
          git pull --rebase origin main
          git push origin HEAD:main
