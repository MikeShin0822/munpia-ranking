name: Collect Munpia rankings

on:
  schedule:
    - cron: '10 22 * * *' # 매일 07:10 KST
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-collect.txt'
  pull_request:
    paths:
      - '.automation/run-collect.txt'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch ranking endpoints in parallel
        shell: bash
        run: |
          set -u
          rm -rf raw
          mkdir -p raw
          ua='Mozilla/5.0 (compatible; MunpiaTitleArchive/1.2; +https://github.com/MikeShin0822/munpia-ranking)'
          for section in today plsa.eachtoday prefer plsa.bestseller; do
            safe=${section//./_}
            for page in 1 2 3; do
              url="https://mm.munpia.com/?ajx=1&menu=best&action=list&section=${section}&keyword=&page=${page}"
              (curl -L -sS --fail --connect-timeout 10 --max-time 45 -A "$ua" -H 'accept-language: ko-KR,ko;q=0.9' "$url" -o "raw/${safe}-${page}.json" || true) &
            done
          done
          (curl -L -sS --fail --connect-timeout 10 --max-time 45 -A "$ua" -H 'accept-language: ko-KR,ko;q=0.9' 'https://www.munpia.com/best/plsa.exclusive-eachtoday' -o raw/exclusive.html || true) &
          wait
          find raw -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Build ranking snapshot
        run: python scripts/build_snapshot_from_raw.py
      - name: Generate daily report
        run: node scripts/report.mjs
      - name: Validate data and analytics
        run: npm test
      - name: Commit updated snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/rankings.json data/latest-report.json; then
            echo "No ranking changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rankings.json data/latest-report.json
            git commit -m "data: collect daily Munpia rankings"
            target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${target_branch}"
          fi
      - name: Verify published dashboard and live data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -u
          expected_date=$(TZ=Asia/Seoul date +%F)
          site='https://mikeshin0822.github.io/munpia-ranking/'
          data='https://raw.githubusercontent.com/MikeShin0822/munpia-ranking/main/data/rankings.json'
          for attempt in {1..6}; do
            site_code=$(curl -L -sS -o site.html -w '%{http_code}' "$site" || true)
            data_code=$(curl -L -sS -o live-rankings.json -w '%{http_code}' "$data" || true)
            echo "attempt=$attempt site_status=$site_code data_status=$data_code expected_date=$expected_date"
            if [ "$site_code" = '200' ] && [ "$data_code" = '200' ] \
              && grep -q '문피아 제목 레이더' site.html \
              && grep -q "\"date\": \"$expected_date\"" live-rankings.json; then
              verified_at=$(TZ=Asia/Seoul date --iso-8601=seconds)
              cat > data/live-verification.json <<EOF
          {
            "verifiedAt": "$verified_at",
            "date": "$expected_date",
            "siteUrl": "$site",
            "siteStatus": $site_code,
            "dataUrl": "$data",
            "dataStatus": $data_code,
            "result": "success"
          }
          EOF
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add data/live-verification.json
              if ! git diff --cached --quiet; then
                git commit -m "ci: verify published Munpia dashboard"
                target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
                git push origin "HEAD:${target_branch}"
              fi
              echo 'Published dashboard and current data verified.'
              exit 0
            fi
            sleep 10
          done
          echo 'Published dashboard verification failed.'
          exit 1
