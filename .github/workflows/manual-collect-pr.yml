name: Manual Munpia collection PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.automation/manual-collect.txt'

permissions:
  contents: write

jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect rankings
        run: npm run collect
      - name: Generate daily report
        run: node scripts/report.mjs
      - name: Validate data and analytics
        run: npm test
      - name: Commit collection to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json data/latest-report.json
          if git diff --cached --quiet; then
            echo "No ranking changes"
          else
            git commit -m "data: collect daily Munpia rankings"
            git push origin HEAD:${{ github.head_ref }}
          fi
