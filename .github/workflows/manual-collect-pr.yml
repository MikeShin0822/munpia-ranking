name: Manual Munpia collection artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect rankings
        run: npm run collect
      - name: Generate daily report
        run: node scripts/report.mjs
      - name: Validate data and analytics
        run: npm test
      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: munpia-data-2026-07-26
          path: |
            data/rankings.json
            data/latest-report.json
          if-no-files-found: error
          retention-days: 1
