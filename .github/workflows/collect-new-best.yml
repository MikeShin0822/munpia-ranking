name: Collect Munpia new best

on:
  schedule:
    - cron: '17 */3 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-new-best.txt'

permissions:
  contents: write

concurrency:
  group: munpia-new-best
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Collect 1-200 new best rankings
        run: python scripts/collect_new_best.py
      - name: Upload parser debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new-best-debug-${{ github.run_id }}
          path: |
            raw/new-best.html
            raw/new-best-debug.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate collected data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('data/new-best/latest.json').read_text(encoding='utf-8'))
          assert latest['status'] == 'complete', latest
          assert latest['count'] == 200, latest['count']
          assert len(latest['rankings']) == 200, len(latest['rankings'])
          assert [x['rank'] for x in latest['rankings']] == list(range(1, 201))
          print('new-best validation passed')
          PY
      - name: Validate new best UI module
        run: node --check new-best.js
      - name: Commit new best snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/new-best
          if git diff --cached --quiet; then
            echo 'No new-best changes'
            exit 0
          fi
          git commit -m 'data: collect Munpia new best'
          git pull --rebase origin main
          git push origin HEAD:main
