name: Export weekly Munpia source 2026-09-07

on:
  push:
    paths:
      - '.automation/run-weekly-source-2026-09-07.txt'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export compact weekly analysis source
        run: python .automation/export_weekly_source_2026_09_07.py
      - name: Validate source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/weekly-patterns/_source-2026-09-07_2026-09-13.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['current']['missingDates'] == [], data['current']['missingDates']
          assert data['previous']['missingDates'] == [], data['previous']['missingDates']
          assert data['current']['entryCount'] == 1050, data['current']['entryCount']
          assert data['newBest']['dayCount'] == 7, data['newBest']['dayCount']
          assert data['newBest']['missingDates'] == [], data['newBest']['missingDates']
          print('weekly source validation passed')
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-source-2026-09-07
          path: data/weekly-patterns/_source-2026-09-07_2026-09-13.json
          retention-days: 1
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns/_source-2026-09-07_2026-09-13.json
          git commit -m 'chore: export weekly source for 2026-09-07'
          git pull --rebase origin main
          git push origin HEAD:main
