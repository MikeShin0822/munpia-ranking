name: Build one weekly Munpia title pattern source

on:
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-weekly-pattern-once.txt'

permissions:
  contents: write

concurrency:
  group: munpia-weekly-pattern-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export weekly source and quantitative skeleton
        shell: bash
        run: |
          python scripts/build_weekly_patterns.py --start 2026-08-17 --end 2026-08-23
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import date
          from pathlib import Path

          data = json.loads(Path('data/rankings.json').read_text(encoding='utf-8'))
          category_labels = {
              'free_today': '무료',
              'paid_today': '유료',
              'exclusive_today': '선독점',
              'favorites': '선호작',
              'bestseller': '베스트셀러',
          }
          start = date.fromisoformat('2026-08-17')
          end = date.fromisoformat('2026-08-23')
          by_title = defaultdict(lambda: {'entries': [], 'categories': set(), 'dates': set()})
          daily = []
          quality = []
          for snapshot in data.get('snapshots', []):
              current = date.fromisoformat(snapshot['date'])
              if not start <= current <= end:
                  continue
              day = {'date': snapshot['date'], 'categories': {}}
              for category, ranking in snapshot.get('rankings', {}).items():
                  titles = ranking.get('titles', [])
                  day['categories'][category] = titles
                  quality.append({
                      'date': snapshot['date'],
                      'category': category,
                      'status': ranking.get('status'),
                      'count': len(titles),
                  })
                  for rank, title in enumerate(titles, start=1):
                      item = by_title[title.strip()]
                      item['entries'].append({
                          'date': snapshot['date'],
                          'category': category,
                          'categoryLabel': category_labels.get(category, category),
                          'rank': rank,
                      })
                      item['categories'].add(category_labels.get(category, category))
                      item['dates'].add(snapshot['date'])
              daily.append(day)

          titles = []
          for title, info in by_title.items():
              entries = info['entries']
              titles.append({
                  'title': title,
                  'bestRank': min(item['rank'] for item in entries),
                  'averageRank': round(sum(item['rank'] for item in entries) / len(entries), 2),
                  'occurrenceCount': len(entries),
                  'top10Occurrences': sum(item['rank'] <= 10 for item in entries),
                  'categories': sorted(info['categories']),
                  'dates': sorted(info['dates']),
                  'entries': entries,
              })
          titles.sort(key=lambda item: (item['bestRank'], -item['occurrenceCount'], item['title']))

          new_best_dir = Path('data/new-best')
          new_best = []
          current = start
          while current <= end:
              path = new_best_dir / f'{current.isoformat()}.json'
              if path.exists():
                  day = json.loads(path.read_text(encoding='utf-8'))
                  new_best.append({
                      'date': current.isoformat(),
                      'snapshots': day.get('snapshots', []),
                  })
              current = date.fromordinal(current.toordinal() + 1)

          source = {
              'schemaVersion': 1,
              'startDate': start.isoformat(),
              'endDate': end.isoformat(),
              'daily': daily,
              'quality': quality,
              'uniqueTitles': titles,
              'uniqueTitleCount': len(titles),
              'newBestDays': new_best,
              'newBestDayCount': len(new_best),
              'newBestSnapshotCount': sum(len(day['snapshots']) for day in new_best),
          }
          output = Path('data/weekly-patterns/_source-2026-08-17_2026-08-23.json')
          output.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'uniqueTitleCount': len(titles),
              'newBestDayCount': len(new_best),
              'newBestSnapshotCount': source['newBestSnapshotCount'],
          }, ensure_ascii=False))
          PY
      - name: Validate export
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('data/weekly-patterns/_source-2026-08-17_2026-08-23.json').read_text(encoding='utf-8'))
          report = json.loads(Path('data/weekly-patterns/2026-08-17_2026-08-23.json').read_text(encoding='utf-8'))
          assert source['startDate'] == '2026-08-17'
          assert source['endDate'] == '2026-08-23'
          assert len(source['daily']) == 7
          assert source['uniqueTitleCount'] >= 80
          assert report['dataQuality']['complete'] is True
          print('weekly source validation passed')
          PY
      - name: Commit temporary source and skeleton
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns
          git commit -m 'analysis: export Aug 17-23 weekly title source'
          git pull --rebase origin main
          git push origin HEAD:main
