name: Build one weekly Munpia title pattern report

on:
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-weekly-pattern-once.txt'

permissions:
  contents: write

concurrency:
  group: munpia-weekly-pattern-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 2026-08-10 to 2026-08-16 report
        run: python scripts/build_weekly_patterns.py --start 2026-08-10 --end 2026-08-16
      - name: Validate report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/weekly-patterns/2026-08-10_2026-08-16.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['startDate'] == '2026-08-10'
          assert report['endDate'] == '2026-08-16'
          assert report['dataQuality']['complete'] is True
          assert len(report['patterns']) >= 8
          print('one-shot weekly report validation passed')
          PY
      - name: Commit generated report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns
          if git diff --cached --quiet; then
            echo 'No weekly report changes'
            exit 0
          fi
          git commit -m 'report: add 2026-08-10 to 2026-08-16 weekly pattern data'
          git pull --rebase origin main
          git push origin HEAD:main
