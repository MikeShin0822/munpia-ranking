name: Export weekly catch-up sources

on:
  push:
    paths:
      - '.automation/run-weekly-catchup-source.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export compact period sources
        run: python .automation/export_weekly_catchup_sources.py
      - name: Validate exported source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/weekly-patterns/_catchup-source-2026-09-14_2026-10-13.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data['periods']) == 4
          expected = {
              '2026-09-14_2026-09-20': 7,
              '2026-09-21_2026-09-27': 7,
              '2026-09-28_2026-10-04': 7,
              '2026-10-05_2026-10-13': 9,
          }
          for period in data['periods']:
              assert period['current']['quality']['expectedDays'] == expected[period['key']]
              assert period['current']['uniqueTitleCount'] > 0
              assert period['current']['entryCount'] > 0
          print('catch-up source validation passed')
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-catchup-source-2026-09-14-2026-10-13
          path: data/weekly-patterns/_catchup-source-2026-09-14_2026-10-13.json
          retention-days: 1
      - name: Commit compact source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns/_catchup-source-2026-09-14_2026-10-13.json
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git commit -m 'chore: export weekly catch-up analysis source'
          git pull --rebase origin main
          git push origin HEAD:main
