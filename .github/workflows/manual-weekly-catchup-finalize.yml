name: Finalize weekly catch-up reports

on:
  push:
    paths:
      - '.automation/run-weekly-catchup-finalize.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write four LLM catch-up reports
        run: python .automation/finalize_weekly_catchup_reports.py
      - name: Validate report files and index
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          root = Path('data/weekly-patterns')
          expected = {
              '2026-09-14_2026-09-20': 7,
              '2026-09-21_2026-09-27': 7,
              '2026-09-28_2026-10-04': 7,
              '2026-10-05_2026-10-13': 9,
          }
          index = json.loads((root / 'index.json').read_text(encoding='utf-8'))
          assert index['latestKey'] == '2026-10-05_2026-10-13'
          for key, days in expected.items():
              report = json.loads((root / f'{key}.json').read_text(encoding='utf-8'))
              start = date.fromisoformat(report['startDate'])
              end = date.fromisoformat(report['endDate'])
              assert (end - start).days + 1 == days
              assert report['dataQuality']['expectedDays'] == days
              assert report['dataQuality']['collectedDays'] == days
              assert report['dataQuality']['complete'] is True
              assert report['analysisMethod'] == 'llm_semantic_with_quantitative_support'
              assert len(report['patterns']) == 10
              assert any(item['key'] == key for item in index['reports'])
          latest = json.loads((root / 'latest.json').read_text(encoding='utf-8'))
          assert latest['startDate'] == '2026-10-05'
          assert latest['endDate'] == '2026-10-13'
          assert latest['periodType'] == 'extended_9_day'
          print('weekly catch-up validation passed')
          PY
      - name: Commit reports and index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns
          if git diff --cached --quiet; then
            echo 'No weekly report changes'
            exit 0
          fi
          git commit -m 'report: add four missing Munpia weekly pattern analyses'
          git pull --rebase origin main
          git push origin HEAD:main
