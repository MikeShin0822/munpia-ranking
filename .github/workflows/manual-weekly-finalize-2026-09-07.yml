name: Finalize weekly Munpia report 2026-09-07

on:
  push:
    paths:
      - '.automation/run-weekly-finalize-2026-09-07.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize weekly report index and latest
        run: python .automation/finalize_weekly_report_2026_09_07.py
      - name: Validate finalized files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('data/weekly-patterns/index.json').read_text(encoding='utf-8'))
          latest = json.loads(Path('data/weekly-patterns/latest.json').read_text(encoding='utf-8'))
          assert index['latestKey'] == '2026-09-07_2026-09-13'
          assert latest['startDate'] == '2026-09-07'
          assert latest['endDate'] == '2026-09-13'
          assert latest['dataQuality']['complete'] is True
          assert latest['analysisMethod'] == 'llm_semantic_with_quantitative_support'
          assert any(item['key'] == index['latestKey'] for item in index['reports'])
          assert len(index['reports']) >= 6
          print('weekly finalization validation passed')
          PY
      - name: Commit weekly index and latest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly-patterns/index.json data/weekly-patterns/latest.json
          if git diff --cached --quiet; then
            echo 'No weekly finalization changes'
            exit 0
          fi
          git commit -m 'report: publish 2026-09-07 weekly LLM title patterns'
          git pull --rebase origin main
          git push origin HEAD:main
