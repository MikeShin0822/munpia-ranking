name: Collect Munpia free today top 200

on:
  schedule:
    - cron: '37 */6 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  push:
    paths:
      - '.automation/run-free-today.txt'

permissions:
  contents: write

concurrency:
  group: munpia-free-today-top-200
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Collect free today rankings 1-200
        run: python scripts/collect_free_today.py
      - name: Upload parser debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-today-debug-${{ github.run_id }}
          path: |
            raw/free-today.html
            raw/free-today-debug.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate collected data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('data/free-today/latest.json').read_text(encoding='utf-8'))
          assert latest['status'] == 'complete', latest
          assert latest['count'] == 200, latest['count']
          assert len(latest['rankings']) == 200, len(latest['rankings'])
          assert [item['rank'] for item in latest['rankings']] == list(range(1, 201))
          assert latest['cutoffs']['200'] is not None
          print('free-today validation passed')
          PY
      - name: Validate free today UI module
        shell: bash
        run: |
          test ! -f free-today.js || node --check free-today.js
      - name: Commit free today snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/free-today
          if git diff --cached --quiet; then
            echo 'No free-today changes'
            exit 0
          fi
          git commit -m 'data: collect Munpia free today top 200'
          git pull --rebase origin main
          git push origin HEAD:main
