name: Verify public Munpia dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.automation/verify-public.txt'

permissions:
  contents: write

# All branch writers share this queue, including verification commits.
# queue:max avoids silently replacing another collector's pending run.
concurrency:
  group: munpia-data-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public site and latest data
        run: python scripts/verify-public.py
      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-verification.json
          if git diff --cached --quiet; then
            echo "No verification changes"
            exit 0
          fi
          git commit -m "ci: record public dashboard verification"
          bash scripts/push-data.sh "$TARGET_BRANCH"
      - name: Preserve unpublished data and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-diagnostics-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .automation-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
